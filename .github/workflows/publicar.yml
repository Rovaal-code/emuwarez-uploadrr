# Publica una versión: pasa los tests completos sobre la punta de master, sube
# __version__, la etiqueta vX.Y.Z, construye la imagen (:X.Y.Z, :<sha>, :latest
# y :edge), publica el manifiesto en Kisnov/uploadrr-version, que es lo que
# lee el aviso de actualización de la app, y crea el release con sus PR.
#
# A mano (Actions → Publicar versión → Run workflow), o solo los días impares del mes si desde
# la última versión se han fusionado al menos 3 PR de ramas feat/ o fix/ (aquí o en Uploadrr-EMU). Con «solo prueba» construye
# :edge de la punta de master, sin tests, versión ni manifiesto.
#
# Con «ref» (un commit de master, una rama o una etiqueta) publica la versión de ESE commit: sin tests (la CI solo corre sobre
# la punta), con la versión y su etiqueta en la rama release/vX.Y.Z en vez de en master (que ya avanzó; se fusiona después) y sin
# mover :edge, que sigue siendo la punta de master.
#
# Necesita el secreto UPLOADRR_VERSION_TOKEN: un token con permiso de escritura
# solo en Kisnov/uploadrr-version (GITHUB_TOKEN no puede escribir en otro repo).
name: Publicar versión

on:
  workflow_dispatch:
    inputs:
      escala:
        description: "auto: minor si hay algún feat desde la última versión, si no patch"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      notas:
        description: "Nota PÚBLICA del aviso, en neutro (vacía: «Correcciones y mejoras»)"
        type: string
        required: false
      solo_prueba:
        description: "Solo construir :edge, sin tests, versión ni manifiesto"
        type: boolean
        default: false
      ref:
        description: "Publicar la versión de este commit en vez de la punta de master (sin tests; la versión va a release/vX.Y.Z)"
        type: string
        required: false
  schedule:
    - cron: "17 4 */2 * *"

permissions: {}

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  decidir:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      accion: ${{ steps.d.outputs.accion }}
      escala: ${{ steps.d.outputs.escala }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - id: d
        env:
          EVENTO: ${{ github.event_name }}
          ESCALA: ${{ inputs.escala || 'auto' }}
          PRUEBA: ${{ inputs.solo_prueba || false }}
          NOTAS: ${{ inputs.notas || 'Correcciones y mejoras' }}
          TOKEN: ${{ secrets.UPLOADRR_VERSION_TOKEN }}
        run: |
          if [ "$PRUEBA" = true ]; then
            echo "accion=prueba" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PR fusionados desde el último commit que cambió la versión, aquí y en Uploadrr-EMU (su main solo
          # llega a la app al construir la imagen): el merge de una rama feat/ o fix/, o el commit feat:/fix:
          # de un squash o un rebase.
          feat='Merge pull request #[0-9]+ from [^/]+/feat/|feat(\([^)]*\))?!?: '
          fix='Merge pull request #[0-9]+ from [^/]+/fix/|fix(\([^)]*\))?!?: '
          base="$(git log -1 --format=%H -G'^__version__' -- emuwarez_uploadrr/__init__.py)"
          prs="$(git log --first-parent --format=%s "$base"..HEAD | grep -E "^($feat|$fix)" || true)"
          git clone -q --bare --filter=blob:none --single-branch --no-tags --branch main https://github.com/Kisnov/Uploadrr-EMU.git "$RUNNER_TEMP/uploadrr"
          commits="$(git -C "$RUNNER_TEMP/uploadrr" log --first-parent --since="$(git log -1 --format=%cI "$base")" --format=%s)"
          prs="$prs"$'\n'"$(printf '%s\n' "$commits" | grep -E "^($feat|$fix)" || true)"
          n="$(printf '%s' "$prs" | grep -c . || true)"
          echo "$n PR feat/fix desde ${base:0:7}"
          if [ "$EVENTO" = schedule ] && [ "$n" -lt 3 ]; then
            echo "accion=nada" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ESCALA" != auto ]; then
            escala="$ESCALA"
          elif printf '%s\n' "$prs" | grep -qE "^($feat)"; then
            escala="minor"
          else
            escala="patch"
          fi
          # Antes de los tests y la imagen, lo que podría pararlo al final.
          # El endpoint de push de git solo responde 200 a quien puede escribir, y no escribe nada.
          if [ -z "$TOKEN" ] || ! printf 'user = "x:%s"\n' "$TOKEN" | curl -sf -o /dev/null --connect-timeout 10 --max-time 30 \
              --config - "https://github.com/Kisnov/uploadrr-version.git/info/refs?service=git-receive-pack"; then
            echo "::error::UPLOADRR_VERSION_TOKEN falta, ha caducado o no puede escribir en Kisnov/uploadrr-version."
            exit 1
          fi
          python3 scripts/publicar_version.py --solo-comprobar --notas "$NOTAS"
          echo "accion=publicar" >> "$GITHUB_OUTPUT"
          echo "escala=$escala" >> "$GITHUB_OUTPUT"

  tests:
    needs: decidir
    if: needs.decidir.outputs.accion == 'publicar' && inputs.ref == ''
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml  # zizmor: ignore[self-repository]

  imagen:
    needs: [decidir, tests]
    if: >-
      !cancelled() &&
      ((needs.decidir.outputs.accion == 'publicar' && (needs.tests.result == 'success' || (inputs.ref != '' && needs.tests.result == 'skipped'))) ||
       needs.decidir.outputs.accion == 'prueba')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      ACCION: ${{ needs.decidir.outputs.accion }}
      REF: ${{ inputs.ref }}
    steps:
      # Con credenciales: este job sube a master (o a release/vX.Y.Z, con ref) el commit de la versión y su
      # etiqueta. .dockerignore excluye .git, así que no llegan a la imagen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4  # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - id: version
        if: env.ACCION == 'publicar'
        env:
          ESCALA: ${{ needs.decidir.outputs.escala }}
          NOTAS: ${{ inputs.notas || 'Correcciones y mejoras' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin master
          # Re-ejecución de un intento que falló después de subir la versión: se completa esa, no otra, aunque
          # master ya haya avanzado. La versión es el primer commit de master sobre el que se lanzó este flujo.
          subida=""
          if [ -z "$REF" ]; then
            subida="$(git log --first-parent --reverse --format='%H %P %s' "$GITHUB_SHA"..origin/master | head -n1 | grep -E "^[0-9a-f]{40} $GITHUB_SHA chore: versión " | cut -d' ' -f1)"
          fi
          if [ -n "$subida" ]; then
            git checkout -q "$subida"
            echo "subida=true" >> "$GITHUB_OUTPUT"
            # Si el manifiesto ya la anuncia, estaba entera: reconstruir cambiaría el digest de :latest.
            publicado="$(gh api repos/Kisnov/uploadrr-version/contents/latest.json --jq .content | base64 -d | jq -r .commit)"
            if [ "$publicado" = "$(git rev-parse HEAD)" ]; then
              echo "::notice::Esta versión ya estaba publicada entera; no se toca nada."
              echo "hecha=true" >> "$GITHUB_OUTPUT"
            else
              # Si ya hay una más nueva publicada, no se vuelve atrás moviendo :latest y :edge.
              python3 scripts/publicar_version.py --solo-comprobar --notas "$NOTAS" --repo
            fi
          else
            python3 scripts/subir_version.py "$ESCALA"
            # La versión nueva contra la publicada, antes de commit e imagen (p. ej. una más alta desde desplegar.sh).
            python3 scripts/publicar_version.py --solo-comprobar --notas "$NOTAS" --repo
            version="$(python3 scripts/subir_version.py --ver)"
            git commit -qam "chore: versión $version"
            git tag -a "v$version" -m "Versión $version"
          fi
          echo "version=$(python3 scripts/subir_version.py --ver)" >> "$GITHUB_OUTPUT"

      - id: sello
        if: steps.version.outputs.hecha != 'true'
        run: |
          uploadrr="$(git ls-remote --exit-code https://github.com/Kisnov/Uploadrr-EMU.git refs/heads/main | cut -f1)"
          test -n "$uploadrr"
          echo "uploadrr=$uploadrr" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "fecha=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Una versión se construye solo con su sha; :X.Y.Z, :latest y :edge llegan cuando master ya la tiene.
          imagen=ghcr.io/kisnov/emuwarez-uploadrr
          if [ "$ACCION" = publicar ]; then
            echo "tags=$imagen:$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$imagen:edge" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.version.outputs.hecha != 'true'

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.version.outputs.hecha != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        if: steps.version.outputs.hecha != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.sello.outputs.tags }}
          build-args: |
            UPLOADRR_COMMIT=${{ steps.sello.outputs.uploadrr }}
            APP_COMMIT=${{ steps.sello.outputs.commit }}
            APP_BUILD_DATE=${{ steps.sello.outputs.fecha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Con la imagen ya subida, y las dos a la vez: si master ha avanzado
      # durante los tests se rechazan las dos y no queda ninguna versión a medias.
      - if: env.ACCION == 'publicar' && steps.version.outputs.subida != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$REF" ]; then
            git push --atomic origin "HEAD:refs/heads/release/v$VERSION" "v$VERSION"
          else
            git push --atomic origin HEAD:master "v$VERSION"
          fi

      - id: etiquetas
        if: env.ACCION == 'publicar' && steps.version.outputs.hecha != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.sello.outputs.commit }}
          NOTAS: ${{ inputs.notas || 'Correcciones y mejoras' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Otra vez justo antes de mover las etiquetas: desde la primera comprobación pasó lo que tarda la imagen,
          # y pudo salir una versión más nueva (p. ej. con desplegar.sh). Así :latest y :edge no vuelven atrás.
          python3 scripts/publicar_version.py --solo-comprobar --notas "$NOTAS" --repo
          imagen=ghcr.io/kisnov/emuwarez-uploadrr
          # Con ref no se mueve :edge: sigue siendo la punta de master.
          edge=(--tag "$imagen:edge"); [ -z "$REF" ] || edge=()
          docker buildx imagetools create --tag "$imagen:$VERSION" --tag "$imagen:latest" "${edge[@]}" "$imagen:$COMMIT"
          echo "digest=$(docker buildx imagetools inspect "$imagen:latest" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      - if: env.ACCION == 'publicar' && steps.version.outputs.hecha != 'true'
        env:
          GH_TOKEN: ${{ secrets.UPLOADRR_VERSION_TOKEN }}
          DIGEST: ${{ steps.etiquetas.outputs.digest }}
          NOTAS: ${{ inputs.notas || 'Correcciones y mejoras' }}
        run: |
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/publicar_version.py --digest "$DIGEST" --notas "$NOTAS" --repo

      # Release con los PR fusionados desde la versión anterior. También al re-ejecutar una ya publicada.
      - if: env.ACCION == 'publicar'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTAS: ${{ inputs.notas || 'Correcciones y mejoras' }}
        shell: bash  # con pipefail: si falla la lista de etiquetas, no se crea con otra anterior
        run: |
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          anterior="$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "v$VERSION" | sort -V | tail -1)"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Versión $VERSION" \
            --notes "$NOTAS" --generate-notes --notes-start-tag "$anterior"
