[project]
name = "emuwarez-uploadrr"
# La versión la declara el paquete (emuwarez_uploadrr/__init__.py) y aquí se
# lee de ahí: estaba escrita en tres sitios con dos valores distintos, así que
# /api/health decía 0.1.0 mientras el código decía 0.2.0.
dynamic = ["version"]
description = "CLI modular para eMuwarez Uploadrr, preparada para interfaz web"
requires-python = ">=3.10"

[project.optional-dependencies]
web = [
    "fastapi>=0.133.0",
    # Desde la 1.5 GZipMiddleware no comprime text/event-stream (/api/eventos) ni
    # las respuestas parciales (206), y comprime las grandes en un hilo.
    "starlette>=1.5.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
    "psutil>=5.9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
emuwarez-uploadrr = "emuwarez_uploadrr.cli:main"
emuwarez-uploader = "emuwarez_uploadrr.cli:main"

[tool.setuptools.dynamic]
version = {attr = "emuwarez_uploadrr.__version__"}

# Sin esto, en un clon setuptools ve también frontend/ como paquete y se niega
# a instalar ("Multiple top-level packages discovered in a flat-layout").
[tool.setuptools.packages.find]
include = ["emuwarez_uploadrr*"]
