# Sube a Codecov el tamaño del bundle de cada commit de master, para que los PR tengan con qué compararse.
name: Bundle

on:
  push:
    branches: [master]
    paths: ['frontend/**', '.github/workflows/bundle.yml']

permissions: {}

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vite build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
