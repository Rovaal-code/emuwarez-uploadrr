name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      # Un PR que solo toca frontend/, docs/ o .md pasa solo los tests que nombran el frontend (HEAD^1 es la base del PR).
      - id: alcance
        if: github.event_name == 'pull_request'
        run: |
          cambios="$(git diff --no-renames --name-only HEAD^1 HEAD)"
          if printf '%s\n' "$cambios" | grep -qvE '^(frontend|docs)/|\.md$'; then
            echo "solo_frontend=false" >> "$GITHUB_OUTPUT"
          else
            echo "solo_frontend=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[web,dev]" ruff==0.17.3
      # Solo errores que rompen en ejecución (sintaxis, nombres sin definir).
      # El estilo lo revisa CodeRabbit sobre las líneas cambiadas.
      - run: ruff check --select E9,F63,F7,F82 --output-format github .
      # Sin red (tests/conftest.py). Cobertura mínima del 78 % (hoy, 80 % en el runner, sin mediainfo ni mkvtoolnix).
      - if: steps.alcance.outputs.solo_frontend != 'true'
        run: pytest -q --cov=emuwarez_uploadrr --cov-report=term-missing --cov-fail-under=78
      - if: steps.alcance.outputs.solo_frontend == 'true'
        run: pytest -q $(grep -l frontend tests/test_*.py)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
