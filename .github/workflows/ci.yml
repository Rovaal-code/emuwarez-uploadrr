name: CI

# En cada PR, y desde «Publicar versión» antes de publicar. En master solo el backend, para que
# Codecov tenga la cobertura de la base con la que compara los PR.
on:
  pull_request:
  push:
    branches: [master]
    paths-ignore: ["frontend/**", "docs/**", "**.md"]
  workflow_call:

permissions:
  contents: read

# Con el evento, un merge a master no cancela los tests de «Publicar versión».
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # La distro fija (no `latest`): de ella salen las versiones de mediainfo, mkvtoolnix y ffmpeg.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # Un PR que solo toca frontend/, docs/ o .md pasa solo los tests que nombran el frontend (HEAD^1 es la base del PR).
      - id: alcance
        if: github.event_name == 'pull_request'
        run: |
          cambios="$(git diff --no-renames --name-only HEAD^1 HEAD)"
          if printf '%s\n' "$cambios" | grep -qvE '^(frontend|docs)/|\.md$'; then
            echo "solo_frontend=false" >> "$GITHUB_OUTPUT"
          else
            echo "solo_frontend=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      # Con los binarios reales, los tests con ficheros de verdad corren en vez de saltarse.
      - if: steps.alcance.outputs.solo_frontend != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends mediainfo mkvtoolnix ffmpeg
      - run: pip install -c constraints.txt -e ".[web,dev]" ruff==0.17.3
      # Solo errores que rompen en ejecución (sintaxis, nombres sin definir).
      # El estilo lo revisa CodeRabbit sobre las líneas cambiadas.
      - run: ruff check --select E9,F --output-format github .
      # Sin red (tests/conftest.py). Cobertura mínima del 78 %.
      - if: steps.alcance.outputs.solo_frontend != 'true'
        run: pytest -q --cov=emuwarez_uploadrr --cov-report=term-missing --cov-report=xml --cov-fail-under=78 --junitxml=junit.xml -o junit_family=legacy
      - if: steps.alcance.outputs.solo_frontend == 'true'
        run: pytest -q $(grep -l frontend tests/test_*.py) --junitxml=junit.xml -o junit_family=legacy
      # Codecov solo informa (continue-on-error): sin CODECOV_TOKEN (Dependabot, workflow_call) la subida falla sin tumbar el CI.
      # fail_ci_if_error hace que pare si la firma de su CLI no cuadra, en vez de ejecutarla igual.
      - if: ${{ !cancelled() && steps.alcance.outputs.solo_frontend != 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        timeout-minutes: 5
        continue-on-error: true
        with:
          files: coverage.xml
          disable_search: true
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
      - if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        timeout-minutes: 5
        continue-on-error: true
        with:
          report_type: test_results
          files: junit.xml
          disable_search: true
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  frontend:
    # En master el bundle ya lo sube Bundle.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
      # Con el token, vite build sube el tamaño del bundle a Codecov (vite.config.ts).
      - run: npx vite build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        timeout-minutes: 5
        continue-on-error: true
        with:
          report_type: test_results
          files: frontend/junit.xml
          disable_search: true
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
