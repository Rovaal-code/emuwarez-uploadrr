# Construye y publica la imagen en ghcr.io/kisnov/emuwarez-uploadrr con cada
# push a master. A mano (Actions → Imagen → Run workflow) sirve para recoger
# cambios de Uploadrr-EMU sin tocar este repo.
#
# Una etiqueta vX.Y.Z (la crea scripts/desplegar.sh al publicar una versión, o
# una release hecha en GitHub) le pone a la imagen ya construida de ese commit
# también la etiqueta X.Y.Z, sin volver a construirla.
name: Imagen

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    # Las construcciones van de una en una, y con `queue: max` esperan todas
    # en la cola. Sin él GitHub guarda solo una pendiente por grupo, y un push
    # nuevo cancelaría la del anterior: si ese commit tenía etiqueta vX.Y.Z, el
    # job version esperaría una imagen que nadie construye. Ese job va en otro
    # grupo porque espera a la imagen de su commit, y en este bloquearía la
    # construcción que la hace.
    concurrency:
      group: imagen
      cancel-in-progress: false
      queue: max
    # A mano también se puede elegir otra rama: solo master publica latest.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: sello
        run: |
          uploadrr="$(git ls-remote --exit-code https://github.com/Kisnov/Uploadrr-EMU.git refs/heads/main | cut -f1)"
          test -n "$uploadrr"
          echo "uploadrr=$uploadrr" >> "$GITHUB_OUTPUT"
          # latest solo si este commit sigue siendo la punta de master: re-ejecutar uno viejo no lo retrasa.
          tags="ghcr.io/kisnov/emuwarez-uploadrr:${GITHUB_SHA}"
          if [ "$(git ls-remote --exit-code origin refs/heads/master | cut -f1)" = "$GITHUB_SHA" ]; then
            tags="$tags,ghcr.io/kisnov/emuwarez-uploadrr:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "fecha=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.sello.outputs.tags }}
          build-args: |
            UPLOADRR_COMMIT=${{ steps.sello.outputs.uploadrr }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_DATE=${{ steps.sello.outputs.fecha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: imagen-version-${{ github.ref_name }}
      cancel-in-progress: false
    # Lo que más puede tardar es esperar a que termine la construcción del commit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # La etiqueta tiene que decir la misma versión que el código de ese
      # commit: si no, el compose fijaría una versión con otra dentro.
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          codigo="$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' emuwarez_uploadrr/__init__.py)"
          if [ "$version" != "$codigo" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con __version__ = \"$codigo\" en ese commit."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Si la etiqueta llega mientras se construye su commit (o con su
      # construcción aún en cola), espera a que la imagen exista.
      - name: Poner la etiqueta de versión a la imagen del commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          imagen=ghcr.io/kisnov/emuwarez-uploadrr
          for intento in $(seq 1 80); do
            docker buildx imagetools inspect "$imagen:$GITHUB_SHA" > /dev/null 2>&1 && break
            if [ "$intento" -eq 80 ]; then
              echo "::error::No hay imagen de $GITHUB_SHA tras 40 minutos: solo se construyen los commits de master. Pon la etiqueta en un commit de master."
              exit 1
            fi
            echo "Aún no hay imagen de $GITHUB_SHA; espero 30 s ($intento/80)…"
            sleep 30
          done
          docker buildx imagetools create --tag "$imagen:$VERSION" "$imagen:$GITHUB_SHA"
          echo "Publicada $imagen:$VERSION (= $imagen:$GITHUB_SHA)"
