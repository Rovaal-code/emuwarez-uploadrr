# docker-compose.yml — despliegue con la imagen publicada
#
# Usa la imagen ya construida en ghcr.io/kisnov/emuwarez-uploadrr, así
# que "docker compose up -d" no necesita compilar nada (ni el frontend ni
# clonar Uploadrr-EMU en build time). Para construir la imagen tú mismo a
# partir del código local, usa docker-compose.example.yml en su lugar.
#
# NOTAS IMPORTANTES:
#
# 1. Uploadrr-EMU va empaquetado DENTRO de la imagen (/opt/Uploadrr) — no
#    hay que montar ni configurar nada aparte para él. Lo único que necesita
#    ser persistente (config.yaml y los temporales de cada subida) vive
#    automáticamente bajo el propio volumen /config (ver docker-entrypoint.sh).
#
# 2. Carpeta de subidas (UPLOADRR_UPLOADS_DIR, abajo):
#    Lo que se sube se enlaza ahí, y Uploadrr-EMU se la da a qBittorrent
#    como ruta de guardado. Tiene que estar en el MISMO sistema de ficheros
#    que la media de Radarr/Sonarr, o el enlace es simbólico en vez de duro,
#    y qBittorrent tiene que verla en la misma ruta que este contenedor.
#    Sin la variable es /config/Uploadrr/uploads, normalmente en otro disco.
#
#    Ejemplo con raíz común /data:
#      /data/media        → media (Radarr/Sonarr)
#      /data/uploads/emu  → carpeta de subidas
#
# 3. API keys: configúralas desde el setup web (http://localhost:9494) o
#    desde Configuración. No las pongas en este fichero ni en .env.

services:
  emuwarez-uploadrr:
    image: ghcr.io/kisnov/emuwarez-uploadrr:${EMUWAREZ_UPLOADRR_TAG:-latest}
    container_name: emuwarez-uploadrr
    restart: unless-stopped

    ports:
      - "${EMUWAREZ_UPLOADRR_PORT:-9494}:9494"

    # Ajusta PUID/PGID al UID/GID del usuario propietario de los archivos de media
    user: "${PUID:-1000}:${PGID:-1000}"

    # Límite de recursos del contenedor. Ajusta a lo que tenga disponible tu
    # equipo: es lo que marca cuántas "Subidas en Paralelo" (Configuración)
    # se sostienen de verdad, porque cada subida activa puede llegar a saturar
    # un núcleo entero (hasheo del torrent) y usar ~0.8 GB de RAM
    # (capturas/remux/transferencia). Con estos 2 núcleos y 2 GB caben
    # teóricamente 2 subidas en paralelo reales. Si quieres más, sube los dos
    # valores a la vez: subir "Subidas en Paralelo" sin darle más CPU y RAM al
    # contenedor no acelera nada.
    cpus: "2"
    mem_limit: "2g"

    environment:
      TZ: ${TZ:-Europe/Madrid}
      CONFIG_DIR: /config
      # Carpeta de subidas: mismo sistema de ficheros que la media (nota 2).
      UPLOADRR_UPLOADS_DIR: /data/uploads/emu

    volumes:
      # Configuración persistente: base de datos SQLite, settings, y el
      # config.yaml/temporales de Uploadrr-EMU (bajo /config/Uploadrr).
      - /srv/emuwarez-uploadrr/config:/config

      # Raíz de datos compartida: media de Radarr/Sonarr y carpeta de subidas.
      - /srv/data:/data

    # Red compartida con Radarr/Sonarr si corren en Docker.
    # Descomenta y ajusta si usas red interna Docker:
    # networks:
    #   - media_net

# networks:
#   media_net:
#     external: true
